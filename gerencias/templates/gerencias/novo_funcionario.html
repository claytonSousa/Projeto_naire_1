{% extends 'bases.html'%}
    
{% block page_title %}
    NOVO FUNCIONÁRIO
{% endblock %}
{% block container %}
    <br><br>
    <div>
        <h3>NOVO FUNCIONÁRIO</h3>
        <form action="{% url 'insere_novo_funcionario' %}" method="POST" >
            {% csrf_token %}
            <label>TIPO FUNCIONARIO</label>
            <select  name="tp_funcionario">
                <option value="1">ADMIN</option>
                <option value="2">MEMBRO</option>
                <option value="3">CONTRATADO</option>
                <option value="4">VOLUNTÁRIO</option>
            </select>
            <br><br>
            <input type="text" placeholder="NOME" name="pnome">
            <br><br>
            <input type="text" placeholder="SOBRENOME" name="snome">
            <br><br>
            <input type="text" placeholder="CPF" name="cpf">
            <br><br>
            <input type="text" placeholder="TEL" name="telefone">
            <br><br>
            <input type="text" placeholder="RUA DA PAZ" name="rua">
            <br><br>
            <input type="text" placeholder="NUMERO" name="numero">
            <br><br>
            <input type="text" placeholder="COMPLEMENTO" name="comp">
            <br><br>
            <input type="text" placeholder="BAIRRO" name="bairro">
            <br><br>
            <input type="text" placeholder="CIDADE" name="cidade">
            <br><br>
            <label>UF</label>
            <select  name="estado">
                <option value="SP">SP</option>
                <option value="RJ">RJ</option>
                <option value="MG">MG</option>
                <option value="SC">SC</option>
                <option value="BA">BA</option>
                <option value="AM">AM</option>
            </select>
            <br><br>
            <label>ATIVO</label>
            <select  name="flag">
                <option value="S">SIM</option>
                <option value="N">NÃO</option>
            </select>
            <br><br>
            <input type="submit" value="Enviar" class="btn btn-primary sm" method="POST" onclick="confirmarAtualizacao()" >
        </form>  
    </div>
    <script>
        function confirmarAtualizacao() {
            if (confirm('Tem certeza que deseja continuar?')) {
                window.location.href = "{% url 'insere_novo_funcionario' %}";
            }
        }
    </script>
{% endblock %}
